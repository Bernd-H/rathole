name: Release Fork Docker

on:
  push:
    tags:
      - "fork-*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag to publish (defaults to git tag name)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  docker:
    name: Publish Fork Image to Docker Hub
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        shell: bash
        run: |
          set -e
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            IMAGE_TAG="${{ github.event.inputs.tag }}"
          else
            IMAGE_TAG="${GITHUB_REF_NAME}"
          fi
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rathole:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/rathole:${{ steps.meta.outputs.image_tag }}
